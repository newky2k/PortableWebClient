# Build and test pull requests into master
# (replaces azure-pipelines-mergetest.yml)
name: Build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: DSoft.Portable.WebClient.slnx
  BUILD_CONFIGURATION: Release

jobs:
  build:
    # windows is required for the WPF TestHarness (net10.0-windows) and the net462 targets
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore packages
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --no-restore --configuration ${{ env.BUILD_CONFIGURATION }}

      - name: Test
        run: dotnet test UnitTester/UnitTester.csproj --no-build --configuration ${{ env.BUILD_CONFIGURATION }}
